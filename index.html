<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="profile-card">
        <div class="image">
            <img src=".//images/42f6ef6a-316d-449e-aafc-de94a38ec36d.jpg" alt="" class="profile-img">
        </div>
        <div class="text-data">
            <span class="Imran">Picci Sin</span>
            <span class="study">Content Creator</span>
        </div>
        <div class="media-button">
            <a href="https://www.facebook.com/profile.php?id=100067121258934" style="background: #4270b2 ;" class="link">
                <i class='bx bxl-facebook'></i>
            </a>
            <a href="#" style="background: #1da1f2 ;" class="link">
                <i class='bx bxl-twitter'></i>
            </a>
            <a href="https://www.instagram.com/mariyam_elma/?hl=en" style="background: #e1306c ;" class="link">
                <i class='bx bxl-instagram'></i>
            </a>
            <a href="#" style="background: #ff0000 ;" class="link">
                <i class='bx bxl-youtube'></i>
            </a>
        </div>

       <div class="buttons">
            <a href="https://www.instagram.com/mariyam_elma/?hl=en">
             <button class="follow-btn">Follow</button>
            </a>
            <a href="https://www.facebook.com/mariyam.elma.2025">
             <button class="follow-btn">Message</button>
            </a>
          

        </div>

      <div class="analytics">
        <div class="data">
            <i class='bx bxs-heart'></i>
            <span class="number">60K</span>
        </div>
        <div class="data">
            <i class='bx bxs-message'></i>
            <span class="number">20K</span>
        </div>
        <div class="data">
            <i class='bx bxs-share'></i>
            <span class="number">12K</span>
        </div>
      </div>
    </div>
</body>
</html>
